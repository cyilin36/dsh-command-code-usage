      # --- Claude 模型：Anthropic Messages 协议 ---------------------------
      # Command Code 对 claude-* 走 /provider/v1/messages。pi-ai 的
      # anthropic-messages 会先剥掉 baseURL 末尾的 /v1，再由 @anthropic-ai/sdk
      # 拼上 /v1/messages —— 所以这里写 /provider 而不写 /provider/v1。
      # 单独开一条路由，是因为 DSH 的 api 字段是「路由级」的，而 Command Code
      # 是「按模型选协议」的。
      command-code-claude:
        displayName: Command Code (Claude)
        apiKeyEnv: COMMAND_CODE_API_KEY
        api: anthropic-messages
        baseURL: https://api.commandcode.ai/provider
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        models:
