# dsh-command-code-usage 组合补丁（dsh.bundle.patch 层）
#
# 装上本包后，`dsh plugin --profile web add dsh-command-code-usage` 会把它
# 追加进 profile 的 `dsh.profile.bundles`，profile 启动时把本文件的两条补丁
# 合入组合树：
#
# 1) `insert` 挂载用量监控插件本身（Host 半边注册 HTTP 路由，client 半边
#    在 Web shell 里渲染悬浮用量坞）。
# 2) 按 id 覆盖 dsh-base 里那条 `llm-pi-ai` 行，注入 `command-code` 提供商
#    预设。
#
# 关于第 2 条：DSH 内置的 pi-ai 目录（@earendil-works/pi-ai 0.85.1，共 39 个
# 提供商）**没有** commandcode，所以这里必须手工声明整条路由——补丁注释里
# 写明「pi-ai 不提供的路由必须自己写全 api + baseURL」。这正是本预设存在的
# 意义：让 command-code 出现在 Web 设置 → 模型 页面里，于是 API Key 可以在
# 标准卡片中填写。
#
# 为什么是「覆盖已有行」而不是「insert 一个新的 llm-pi-ai 实例」：
# dsh-llm-pi-ai 通过 `settings.installSection(ctx, 'llm-pi-ai', ...)` 注册
# 设置命名空间，而设置服务的 `register()` 对重复命名空间**直接抛错**。所以
# 第二个实例会在启动时炸掉。只能覆盖那一行——那条基础行本身不带 config，
# 覆盖它不会丢失任何东西。
#
# 覆盖后 providers 会成为「组合 base 层」，用户 ~/.dsh/settings.yaml 里的
# llm-pi-ai.providers 会**按提供商逐字段深合并**覆盖其上（设置服务用
# mergeLayers 深合并）。所以：预设提供开箱可用的 command-code 路由，用户
# 在设置页/设置文件里的改动优先，两不相犯。
#
# 凭据：两条路由都引用 COMMAND_CODE_API_KEY。监控插件默认解析同一个引用，
# 因此「用量坞里填 Key」和「模型页里填 Key」写的是同一处
# （~/.dsh/.credentials.yaml 的 refs 下），彼此等价、不必填两遍。

- insert:
    - id: command-code-usage
      # Node 可解析的包名，必须与 package.json 的 name 一致。
      name: 'dsh-command-code-usage'
      config:
        # 凭据引用：与下面 command-code 路由的 apiKeyEnv 保持一致。
        apiKeyEnv: COMMAND_CODE_API_KEY
        # Command Code 账户/计费 API 起点。
        apiBase: https://api.commandcode.ai
        # 自动刷新间隔；用量坞内还有手动刷新按钮。
        refreshMs: 60000
        timeoutMs: 15000

# 给 dsh-llm-pi-ai 注入 Command Code 提供商预设。
- id: llm-pi-ai
  config:
    providers:
      # --- 非 Claude 模型：OpenAI 兼容协议 -------------------------------
      # pi-ai 的 openai-completions 会把 baseURL 与 "/chat/completions" 拼接，
      # 因此这里要带 /v1。
      command-code:
        displayName: Command Code
        apiKeyEnv: COMMAND_CODE_API_KEY
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        # 手工声明的路由拿不到目录里的容量信息，这里给一个兜底；
        # 若某模型实际窗口不同，在设置 → 模型 里单独改该模型即可。
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 262144
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: { off: , low: low, medium: medium, high: high, xhigh: xhigh, max: max }
